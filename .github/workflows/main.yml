name: Build XMRig 6.26.0 - WebAssembly (Zero Fee)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WebAssembly (WASM)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout XMRig 6.26.0
        uses: actions/checkout@v4
        with:
          repository: xmrig/xmrig
          ref: b2ca72480c58d197e18c885d9fc1a0c8d517e60a
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            python3 \
            zip

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build libuv for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch v1.49.2 https://github.com/libuv/libuv.git libuv
          cd libuv

          mkdir build && cd build
          
          emcmake cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLIBUV_BUILD_SHARED=OFF \
            -DCMAKE_C_FLAGS="-pthread"

          cmake --build . --parallel $(nproc)

          UV_LIB_PATH="$(readlink -f $(find . -name 'libuv*.a' -print -quit))"
          echo "UV_LIBRARY=$UV_LIB_PATH" >> "$GITHUB_ENV"
          echo "UV_INCLUDE_DIR=$GITHUB_WORKSPACE/libuv/include" >> "$GITHUB_ENV"

      - name: Configure XMRig for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          # ۱. صفر کردن کامل دونیت و کارمزد توسعه‌دهنده (0% Dev Fee)
          sed -i 's/constexpr const int kDefaultDonateLevel = 1;/constexpr const int kDefaultDonateLevel = 0;/g' src/donate.h
          sed -i 's/constexpr const int kMinimumDonateLevel = 1;/constexpr const int kMinimumDonateLevel = 0;/g' src/donate.h

          # ۲. رفع باگ تغییر نام Target هنگام غیرفعال بودن TLS (-notls) و غیرفعال‌سازی strip
          sed -i 's/-notls//g' CMakeLists.txt cmake/OpenSSL.cmake 2>/dev/null || true
          sed -i 's/COMMAND strip/COMMAND true/g' CMakeLists.txt 2>/dev/null || true
          sed -i 's/COMMAND \${CMAKE_STRIP}/COMMAND true/g' CMakeLists.txt 2>/dev/null || true

          # ۳. حذف تمام پرچم‌های پرپردازنده x86 که در Wasm وجود ندارند
          find cmake/ -type f -exec sed -i -E 's/-m(aes|vaes|pclmul)//g' {} +
          sed -i -E 's/-m(aes|vaes|pclmul)//g' CMakeLists.txt 2>/dev/null || true

          # ۴. خنثی‌سازی کدهای x86 Inline Assembly و CPUID
          find src/ -type f -exec sed -i -E 's/# *include *[<"]cpuid\.h[>"]/#define __cpuid(a,b,c,d,e) do { (b)=(c)=(d)=(e)=0; } while(0)\n#define __cpuid_count(a,b,c,d,e,f) do { (c)=(d)=(e)=(f)=0; } while(0)/g' {} +
          sed -i 's/__asm__ __volatile__("xgetbv": "=a"(eax_reg), "=d"(edx_reg) : "c"(0) : "cc");/eax_reg = 0; edx_reg = 0;/g' src/backend/cpu/platform/BasicCpuInfo.cpp

          # ۵. جایگزینی x86intrin.h با emmintrin.h و مپ کردن Soft AES برای CryptoNight
          find src/ -type f -exec sed -i -E 's/# *include *[<"](x86intrin|ia32intrin)\.h[>"]/#include <emmintrin.h>/g' {} +
          sed -i '1s/^/#define _mm_aesenc_si128 soft_aesenc\n#define _mm_aeskeygenassist_si128(a,b) soft_aeskeygenassist<b>(a)\n/' src/crypto/cn/CryptoNight_x86.h

          # ۶. خنثی‌سازی کامل تمام دستورات _mm_setcsr در RandomX و توابع خاص سیستم‌عامل لینوکس
          find src/crypto/randomx/ -type f -exec sed -i 's/_mm_setcsr.*;/(void)0;/g' {} +
          find src/crypto/randomx/ -type f -exec sed -i 's/_mm_getcsr.*/0;/g' {} +
          sed -i 's/pthread_setaffinity_np(.*)/0/g' src/base/kernel/Platform_unix.cpp
          sed -i 's/sched_setscheduler([^)]*)/0/g' src/base/kernel/Platform_unix.cpp

          # ۷. پیاده‌سازی متدهای دقیق VirtualMemory و توابع داخلی libuv برای WebAssembly
          cat << 'EOF' > src/crypto/common/VirtualMemory_unix.cpp
          #include "crypto/common/VirtualMemory.h"
          #include <cstdlib>
          #include <cstring>
          #include <cstdint>

          namespace xmrig {

          void *VirtualMemory::allocateExecutableMemory(size_t size, bool hugePages)
          {
              void *ptr = nullptr;
              if (posix_memalign(&ptr, 4096, size) != 0 || !ptr) {
                  ptr = std::malloc(size);
              }
              if (ptr) {
                  std::memset(ptr, 0, size);
              }
              return ptr;
          }

          bool VirtualMemory::protectRW(void *ptr, size_t size)
          {
              return true;
          }

          bool VirtualMemory::protectRX(void *ptr, size_t size)
          {
              return true;
          }

          void VirtualMemory::flushInstructionCache(void *ptr, size_t size)
          {
          }

          bool VirtualMemory::isHugepagesAvailable()
          {
              return false;
          }

          bool VirtualMemory::isOneGbPagesAvailable()
          {
              return false;
          }

          bool VirtualMemory::allocateLargePagesMemory()
          {
              return false;
          }

          bool VirtualMemory::allocateOneGbPagesMemory()
          {
              return false;
          }

          void *VirtualMemory::allocateLargePagesMemory(size_t size)
          {
              return nullptr;
          }

          void *VirtualMemory::allocateOneGbPagesMemory(size_t size)
          {
              return nullptr;
          }

          bool VirtualMemory::adviseLargePages(void *ptr, size_t size)
          {
              return false;
          }

          void VirtualMemory::freeLargePagesMemory(void *ptr, size_t size)
          {
              if (ptr) {
                  std::free(ptr);
              }
          }

          void VirtualMemory::osInit(size_t size)
          {
          }

          } // namespace xmrig

          extern "C" {
          uint64_t uv__hrtime(unsigned int) { return 0; }
          int uv__io_poll(void*, int) { return 0; }
          int uv__platform_loop_init(void*) { return 0; }
          void uv__platform_invalidate_fd(void*, int) {}
          void uv__process_title_cleanup(void) {}
          int uv__fs_event_close(void*) { return 0; }
          int uv_fs_event_init(void*, void*) { return 0; }
          int uv_fs_event_start(void*, void*, const char*, unsigned int) { return 0; }
          int uv_fs_event_stop(void*) { return 0; }
          int uv_exepath(char* buffer, size_t* size) { if (buffer && size && *size > 0) { buffer[0] = 0; } return 0; }
          char** uv_setup_args(int argc, char** argv) { return argv; }
          int uv_interface_addresses(void**, int* count) { if (count) *count = 0; return 0; }
          void uv_free_interface_addresses(void*, int) {}
          int uv_resident_set_memory(size_t* rss) { if (rss) *rss = 0; return 0; }
          uint64_t uv_get_free_memory(void) { return 1073741824ULL; }
          uint64_t uv_get_total_memory(void) { return 2147483648ULL; }
          void uv_loadavg(double avg[3]) { if (avg) { avg[0] = avg[1] = avg[2] = 0.0; } }
          }
          EOF

          rm -rf build
          mkdir build
          cd build

          emcmake cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXMRIG_OS_LINUX=ON \
            -DUV_LIBRARY="$UV_LIBRARY" \
            -DUV_INCLUDE_DIR="$UV_INCLUDE_DIR" \
            -DWITH_ASM=OFF \
            -DWITH_MSR=OFF \
            -DWITH_DMI=OFF \
            -DWITH_HWLOC=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_TLS=OFF \
            -DWITH_HTTPD=OFF \
            -DWITH_GHOSTRIDER=OFF \
            -DWITH_KAWPOW=OFF \
            -DWITH_CN_GPU=OFF \
            -DWITH_ASTROBWT=OFF \
            -DCMAKE_C_FLAGS="-msimd128 -pthread -D__SSE__ -D__SSE2__" \
            -DCMAKE_CXX_FLAGS="-msimd128 -pthread -D__SSE__ -D__SSE2__" \
            -DCMAKE_EXE_LINKER_FLAGS="-s USE_PTHREADS=1 -s PTHREAD_POOL_SIZE=4 -s WASM=1 -s INITIAL_MEMORY=256MB -s MAXIMUM_MEMORY=2GB -s ALLOW_MEMORY_GROWTH=1"

      - name: Build XMRig Wasm
        run: |
          cmake --build build --parallel $(nproc)

      - name: Package Wasm Artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output_wasm

          # جمع‌آوری خروجی‌های .wasm و .js
          find build -type f \( -name "*.wasm" -o -name "*.js" -o -name "*.worker.js" \) -exec cp {} output_wasm/ \;

          cd output_wasm
          zip -r "../xmrig-wasm.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-wasm
          path: xmrig-wasm.zip
          if-no-files-found: error

name: Build XMRig 6.26.0 - WebAssembly (Zero Fee)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WebAssembly (WASM)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout XMRig 6.26.0
        uses: actions/checkout@v4
        with:
          repository: xmrig/xmrig
          ref: b2ca72480c58d197e18c885d9fc1a0c8d517e60a
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            python3 \
            zip

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Build libuv for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch v1.49.2 https://github.com/libuv/libuv.git libuv
          cd libuv

          mkdir build && cd build
          
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLIBUV_BUILD_SHARED=OFF

          cmake --build . --parallel $(nproc)

          UV_LIB_PATH="$(readlink -f $(find . -name 'libuv*.a' -print -quit))"
          echo "UV_LIBRARY=$UV_LIB_PATH" >> "$GITHUB_ENV"
          echo "UV_INCLUDE_DIR=$GITHUB_WORKSPACE/libuv/include" >> "$GITHUB_ENV"

      - name: Configure XMRig for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          # ۱. صفر کردن کامل دونیت و کارمزد توسعه‌دهنده (0% Dev Fee)
          sed -i 's/constexpr const int kDefaultDonateLevel = 1;/constexpr const int kDefaultDonateLevel = 0;/g' src/donate.h
          sed -i 's/constexpr const int kMinimumDonateLevel = 1;/constexpr const int kMinimumDonateLevel = 0;/g' src/donate.h

          # ۲. رفع باگ تغییر نام Target هنگام غیرفعال بودن TLS (-notls)
          sed -i 's/-notls//g' CMakeLists.txt cmake/OpenSSL.cmake 2>/dev/null || true

          # ۳. حذف تمام پرچم‌های پرپردازنده x86 که در Wasm وجود ندارند
          find cmake/ -type f -exec sed -i -E 's/-m(aes|vaes|pclmul|sse|sse2|sse3|ssse3|sse4\.1|sse4\.2|avx|avx2|fma|fma4|xop)//g' {} +
          sed -i -E 's/-m(aes|vaes|pclmul|sse|sse2|sse3|ssse3|sse4\.1|sse4\.2|avx|avx2|fma|fma4|xop)//g' CMakeLists.txt 2>/dev/null || true

          # ۴. خنثی‌سازی دستورات x86 Inline Assembly در فایل BasicCpuInfo.cpp برای Wasm
          sed -i '1s/^/#define __cpuid(level, a, b, c, d) do { a = b = c = d = 0; } while(0)\n#define __cpuid_count(level, count, a, b, c, d) do { a = b = c = d = 0; } while(0)\n#define __asm__(...)\n/' src/backend/cpu/platform/BasicCpuInfo.cpp

          rm -rf build
          mkdir build
          cd build

          emcmake cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXMRIG_OS_LINUX=ON \
            -DUV_LIBRARY="$UV_LIBRARY" \
            -DUV_INCLUDE_DIR="$UV_INCLUDE_DIR" \
            -DWITH_ASM=OFF \
            -DWITH_MSR=OFF \
            -DWITH_DMI=OFF \
            -DWITH_HWLOC=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_TLS=OFF \
            -DWITH_HTTPD=OFF \
            -DWITH_GHOSTRIDER=OFF \
            -DWITH_KAWPOW=OFF \
            -DWITH_CN_GPU=OFF \
            -DWITH_ASTROBWT=OFF \
            -DCMAKE_C_FLAGS="-msimd128 -pthread" \
            -DCMAKE_CXX_FLAGS="-msimd128 -pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-s USE_PTHREADS=1 -s PTHREAD_POOL_SIZE=4 -s WASM=1 -s INITIAL_MEMORY=256MB -s MAXIMUM_MEMORY=2GB -s ALLOW_MEMORY_GROWTH=1"

      - name: Build XMRig Wasm
        run: |
          cmake --build build --parallel $(nproc)

      - name: Package Wasm Artifacts
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output_wasm

          # جمع‌آوری خروجی‌های .wasm و .js
          find build -type f \( -name "*.wasm" -o -name "*.js" -o -name "*.worker.js" \) -exec cp {} output_wasm/ \;

          cd output_wasm
          zip -r "../xmrig-wasm.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrig-wasm
          path: xmrig-wasm.zip
          if-no-files-found: error
